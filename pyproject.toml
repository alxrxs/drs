[project]
name = "drs"
version = "0.1.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
description = "Windows Hello for Business key-trust device registration and key provisioning without AD FS"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "ldap3>=2.9",
]

[project.optional-dependencies]
# roadlib is ROADtools' client side: the tests check drs's tokens against it.
test = ["pytest", "roadlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
